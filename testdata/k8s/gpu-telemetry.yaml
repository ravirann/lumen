# Synthetic HTTP JSON only: no NVIDIA driver/exporter/hardware validation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-telemetry-fixture
  namespace: lumen-e2e-a
data:
  server.py: |
    import json, re
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs
    def literal(query, label, default):
        match = re.search(r'(?:^|,)'+label+r'=("(?:[^"\\]|\\.)*")', query)
        return json.loads(match.group(1)) if match else default
    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *args): pass
        def do_GET(self):
            parsed = urlparse(self.path)
            if parsed.path == '/ready':
                self.send_response(200); self.end_headers(); return
            try:
                params = parse_qs(parsed.query)
                query = params['query'][0]
                cluster = literal(query, 'cluster', 'fixture')
                ns = literal(query, 'namespace', '')
                metric = {'__name__':'DCGM_FI_DEV_GPU_UTIL','UUID':'GPU-synthetic','cluster':cluster,'namespace':ns,'private':'SECRET_FIXTURE'}
                if parsed.path == '/api/v1/query':
                    result = [{'metric':metric,'value':[1,'25']}]
                    kind = 'vector'
                elif parsed.path == '/api/v1/query_range':
                    start, end = float(params['start'][0]), float(params['end'][0])
                    result = [{'metric':metric,'values':[[start,'0'],[(start+end)/2,'NaN'],[end,'25']]}]
                    kind = 'matrix'
                    if cluster == 'series-limit': result = result*201
                    if cluster == 'bytes-limit': metric['private'] = 'x'*(4*1024*1024)
                else:
                    self.send_response(404); self.end_headers(); return
                data = json.dumps({'status':'success','data':{'resultType':kind,'result':result}}).encode()
                self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(data))); self.end_headers(); self.wfile.write(data)
            except (ValueError, KeyError):
                self.send_response(400); self.end_headers()
    HTTPServer(('0.0.0.0',9090),Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-telemetry-fixture
  namespace: lumen-e2e-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: gpu-telemetry-fixture}
  template:
    metadata:
      labels: {app: gpu-telemetry-fixture}
    spec:
      containers:
        - name: http-json
          image: python:3.12-alpine
          command: [python, /fixture/server.py]
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /ready, port: 9090}
          volumeMounts: [{name: fixture, mountPath: /fixture, readOnly: true}]
      volumes:
        - name: fixture
          configMap: {name: gpu-telemetry-fixture}
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-telemetry-fixture
  namespace: lumen-e2e-a
spec:
  selector: {app: gpu-telemetry-fixture}
  ports: [{name: http, port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: telemetry-reader, namespace: lumen-e2e-a}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: telemetry-denied, namespace: lumen-e2e-a}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: telemetry-reader, namespace: lumen-e2e-a}
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["gpu-telemetry-fixture:9090"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: telemetry-reader, namespace: lumen-e2e-a}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: telemetry-reader}
subjects:
  - {kind: ServiceAccount, name: telemetry-reader, namespace: lumen-e2e-a}
