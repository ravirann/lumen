name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v0.1.0). Leave empty on main to auto-detect from package.json."
        required: false

permissions:
  contents: write
  security-events: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: detect version bump
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
      should_release: ${{ steps.compute.outputs.should_release }}
      sha: ${{ steps.compute.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: compute
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          resolve_tag() {
            # 1. manual dispatch with explicit tag
            if [ -n "${INPUT_TAG:-}" ]; then
              echo "$INPUT_TAG"; return
            fi
            # 2. tag push
            if [ "$REF_TYPE" = "tag" ]; then
              echo "$REF_NAME"; return
            fi
            # 3. main push — use the current package.json version.
            # We release whenever the matching tag doesn't exist yet,
            # so a prior failed release (tag never created) self-heals
            # on the next push instead of needing another version bump.
            CURR=$(jq -r .version package.json)
            if [ -n "$CURR" ] && [ "$CURR" != "null" ]; then
              echo "v$CURR"
            fi
          }

          TAG="$(resolve_tag)"
          SHOULD=false
          SHA="$(git rev-parse HEAD)"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version tag, got '$TAG'."
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            # Retry an existing draft against its original immutable commit.
            # Missing release metadata is recoverable; API failures are not.
            RELEASES="$(gh api "repos/$REPO/releases" --paginate --slurp)"
            STATE="$(jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | if length == 0 then "missing" elif .[0].draft then "draft" else "published" end' <<< "$RELEASES")"
            if [ "$STATE" != "published" ]; then SHOULD=true; fi
          else
            SHOULD=true
          fi
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(git show "$SHA:package.json" | jq -r .version)"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version does not match its package.json."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "should_release=$SHOULD"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "resolved: tag='$TAG' sha='$SHA' should_release='$SHOULD'"

  verify:
    name: verify release commit
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.detect.outputs.sha }}
    permissions:
      contents: read

  analyze:
    name: analyze release commit
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/codeql.yml
    with:
      checkout_ref: ${{ needs.detect.outputs.sha }}
    permissions:
      contents: read
      security-events: write

  create-release:
    name: create draft release
    needs: [detect, verify, analyze]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            NOTES_ARGS=(--generate-notes)
            if [ -f "docs/release/$TAG.md" ]; then
              NOTES_ARGS=(--notes-file "docs/release/$TAG.md")
            fi
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "Lumen $TAG" \
              "${NOTES_ARGS[@]}"
          fi

  build-macos:
    name: build · macos (${{ matrix.target }})
    needs: [detect, create-release]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Verify Rust toolchain
        # macOS-14 runners ship a rustup-init shim at /usr/local/bin/cargo
        # that swallows `cargo metadata` and prints rustup-init usage —
        # Tauri's build then dies with "unexpected argument 'metadata'".
        # Forcing a default toolchain + asserting the real cargo is first
        # in PATH catches that failure mode loudly instead of inside tauri.
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup default stable
          rustup target add "$RUST_TARGET"
          echo "cargo path: $(command -v cargo)"
          cargo --version
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Detect signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "::notice::Building SIGNED + NOTARIZED release (Apple secrets present)."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not configured. Producing UNSIGNED DMGs. Users will see Gatekeeper warnings. Add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID repo secrets to enable signing."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          EXISTING=()
          while IFS= read -r entry; do
            EXISTING+=("$entry")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING[@]}"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # Two Build steps below — signed vs unsigned — because GitHub Actions
      # has no clean way to conditionally omit individual env vars. Tauri's
      # bundler interprets `APPLE_ID=""` and `APPLE_TEAM_ID=""` as "notarize
      # with empty creds" rather than "skip notarize", so in unsigned mode
      # we must not pass those vars at all. Ad-hoc sign ("-") keeps codesign
      # happy without a Developer ID cert.

      - name: Build Tauri app (signed)
        if: steps.signing.outputs.mode == 'signed'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          tagName: ${{ needs.detect.outputs.tag }}
          releaseName: "Lumen ${{ needs.detect.outputs.tag }}"
          releaseBody: |
            Lumen ${{ needs.detect.outputs.tag }}

            Signed & notarized macOS builds:
            - `Lumen_${{ needs.detect.outputs.version }}_aarch64.dmg` — Apple Silicon
            - `Lumen_${{ needs.detect.outputs.version }}_x64.dmg` — Intel
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (unsigned, ad-hoc)
        if: steps.signing.outputs.mode == 'unsigned'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          tagName: ${{ needs.detect.outputs.tag }}
          releaseName: "Lumen ${{ needs.detect.outputs.tag }}"
          releaseBody: |
            Lumen ${{ needs.detect.outputs.tag }}

            Unsigned macOS builds (ad-hoc signature, Gatekeeper will warn):
            - `Lumen_${{ needs.detect.outputs.version }}_aarch64.dmg` — Apple Silicon
            - `Lumen_${{ needs.detect.outputs.version }}_x64.dmg` — Intel

            To open: right-click → Open, then confirm. For a properly signed
            build, add Apple Developer secrets to the repo.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Cleanup keychain
        if: always() && steps.signing.outputs.mode == 'signed'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  build-linux:
    name: build · linux (${{ matrix.target }})
    needs: [detect, create-release]
    if: needs.detect.outputs.should_release == 'true'
    # Pinning ubuntu-22.04 — its glibc 2.35 baseline is the widest-compatible
    # Ubuntu LTS that still has webkit2gtk-4.1 packaged. Newer runners (24.04+)
    # ship glibc 2.39 which shrinks the set of distros that can run our binary.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Verify Rust toolchain
        # macOS-14 runners ship a rustup-init shim at /usr/local/bin/cargo
        # that swallows `cargo metadata` and prints rustup-init usage —
        # Tauri's build then dies with "unexpected argument 'metadata'".
        # Forcing a default toolchain + asserting the real cargo is first
        # in PATH catches that failure mode loudly instead of inside tauri.
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup default stable
          rustup target add "$RUST_TARGET"
          echo "cargo path: $(command -v cargo)"
          cargo --version
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      # Tauri 2 on Linux needs webkit2gtk-4.1 (the GTK4 webview), GTK3 dev
      # headers (still required by some bundler crates), libsoup-3, and the
      # standard rpm/dpkg/appimage tooling. librsvg2-dev is required for icon
      # rendering inside the bundler.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            rpm \
            file

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.detect.outputs.tag }}
          releaseName: "Lumen ${{ needs.detect.outputs.tag }}"
          releaseBody: |
            Lumen ${{ needs.detect.outputs.tag }}

            Linux builds (unsigned — verify the SHA from the release page if redistributing):
            - `Lumen_${{ needs.detect.outputs.version }}_amd64.deb` — Debian / Ubuntu
            - `Lumen_${{ needs.detect.outputs.version }}-1.x86_64.rpm` — Fedora / RHEL
            - `Lumen_${{ needs.detect.outputs.version }}_amd64.AppImage` — distro-agnostic
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  build-windows:
    name: build · windows (${{ matrix.target }})
    needs: [detect, create-release]
    if: needs.detect.outputs.should_release == 'true'
    # windows-latest currently means Windows Server 2022. Tauri 2 ships an
    # MSI + NSIS bundler out of the box on this image; WebView2 runtime is
    # already present so end users without it get the bootstrapper from
    # the .exe installer.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Verify Rust toolchain
        # macOS-14 runners ship a rustup-init shim at /usr/local/bin/cargo
        # that swallows `cargo metadata` and prints rustup-init usage —
        # Tauri's build then dies with "unexpected argument 'metadata'".
        # Forcing a default toolchain + asserting the real cargo is first
        # in PATH catches that failure mode loudly instead of inside tauri.
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup default stable
          rustup target add "$RUST_TARGET"
          echo "cargo path: $(command -v cargo)"
          cargo --version
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.detect.outputs.tag }}
          releaseName: "Lumen ${{ needs.detect.outputs.tag }}"
          releaseBody: |
            Lumen ${{ needs.detect.outputs.tag }}

            Windows builds (unsigned — SmartScreen will warn on first run; verify the SHA from the release page before redistributing):
            - `Lumen_${{ needs.detect.outputs.version }}_x64-setup.exe` — NSIS installer
            - `Lumen_${{ needs.detect.outputs.version }}_x64_en-US.msi` — MSI for managed deployments
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  validate-release:
    name: validate draft assets
    needs: [detect, build-macos, build-linux, build-windows]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate release asset manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets > "$RUNNER_TEMP/assets.json"
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir "$RUNNER_TEMP"
          node scripts/verify-release-assets.mjs "$TAG" "$REPO" "$RUNNER_TEMP/assets.json" "$RUNNER_TEMP/latest.json"
          echo "Validated draft $TAG. Review platform installation, upgrade behavior, signing and release notes before publishing." >> "$GITHUB_STEP_SUMMARY"
